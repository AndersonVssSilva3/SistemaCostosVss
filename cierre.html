<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cierre - OMEGA SAC</title>
    <link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/professional.css">
</head>
<!-- 1. CDN Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<!-- 2. Configuración Supabase -->
<script src="js/supabase-config.js"></script>
<!-- 3. Base de datos -->
<script src="js/db.js"></script>
<!-- 4. Resto -->
<script src="js/utils.js"></script>
<script src="js/accounting.js"></script>
<script src="js/cierre.js"></script>
<script src="js/professional.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', async function() {
        if (!initSupabase()) {
            alert('❌ Error: No se pudo conectar con Supabase');
            return;
        }
        await initDefaultData();
        updateDateTime();
        setInterval(updateDateTime, 60000);
        await initCierre();
    });
</script>

<body>

<div class="header">
    <div>
        <div class="company-name">OMEGA SAC</div>
        <h1>🔒 CIERRE</h1>
    </div>
    <div style="display:flex; align-items:center; gap:15px;">
        <a href="index.html" class="home-btn">🏠 Inicio</a>
        <div class="datetime" id="currentDateTime"></div>
    </div>
</div>

<div class="sub-nav">
    <button class="active" onclick="showTab('cie-ajustes', this)">🔧 Ajustes</button>
    <button onclick="showTab('cie-cierre', this)">🔒 Cierre Ejercicio</button>
</div>

<div class="main-content">
    <div id="alertContainer"></div>

    <div class="tab-content active" id="cie-ajustes">
        <div class="card">
            <h2>🔧 Ajustes Contables</h2>
            <div class="btn-group" style="margin-bottom:15px;">
                <button class="btn btn-info" onclick="openModal('modalAjuste')">➕ Nuevo Ajuste</button>
            </div>
            <div class="table-container">
                <table>
                    <thead>
                        <tr><th>Fecha</th><th>Descripción</th><th>Cuenta Debe</th><th>Cuenta Haber</th><th style="text-align:right;">Monto</th><th>Estado</th><th>Acciones</th></tr>
                    </thead>
                    <tbody id="ajustesTable"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="tab-content" id="cie-cierre">
        <div class="card">
            <h2>🔒 Cierre del Ejercicio</h2>
            <div class="dashboard-grid">
                <div class="stat-card"><h4>Ejercicio Fiscal</h4><div class="value">2026</div></div>
                <div class="stat-card"><h4>Estado</h4><div class="value" style="font-size:1.2em; color:#f57c00;">En Proceso</div></div>
                <div class="stat-card"><h4>Asientos de Cierre</h4><div class="value">0</div></div>
            </div>
            <div class="btn-group">
                <button class="btn btn-warning" onclick="generarAsientosCierre()">🔄 Generar Asientos de Cierre</button>
                <button class="btn btn-danger" onclick="ejecutarCierre()">🔒 Ejecutar Cierre del Ejercicio</button>
            </div>
            <div id="cierreResult" style="margin-top:20px;"></div>
        </div>
    </div>

    <div class="footer-info"><p>Sistema de Contabilidad OMEGA SAC © 2026</p></div>
</div>

<div class="modal-overlay" id="modalAjuste">
    <div class="modal">
        <button class="close-btn" onclick="closeModal('modalAjuste')">&times;</button>
        <h2>Nuevo Ajuste Contable</h2>
        <div class="form-group"><label>Fecha</label><input type="date" id="ajusteFecha"></div>
        <div class="form-group"><label>Descripción</label><input type="text" id="ajusteDesc"></div>
        <div class="form-row">
            <div class="form-group"><label>Cuenta Debe</label><select id="ajusteCuentaDebe"></select></div>
            <div class="form-group"><label>Cuenta Haber</label><select id="ajusteCuentaHaber"></select></div>
        </div>
        <div class="form-group"><label>Monto</label><input type="number" id="ajusteMonto" step="0.01"></div>
        <div class="btn-group">
            <button class="btn btn-success" onclick="guardarAjuste()">💾 Guardar</button>
            <button class="btn btn-danger" onclick="closeModal('modalAjuste')">Cancelar</button>
        </div>
    </div>
</div>

<script src="js/db.js"></script>
<script src="js/utils.js"></script>
<script src="js/accounting.js"></script>
<script src="js/cierre.js"></script>
<script src="js/professional.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        initDefaultData();
        updateDateTime();
        setInterval(updateDateTime, 60000);
        initCierre();
    });
</script>

</body>
</html>
