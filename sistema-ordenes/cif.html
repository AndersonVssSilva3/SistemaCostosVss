<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VSS Fábrica · CIF</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚙️</text></svg>">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/professional.css">
    <link rel="stylesheet" href="css/vss.css">
    <link rel="stylesheet" href="css/vss-3d.css">
    <link rel="stylesheet" href="css/fab-menu.css">
    <link rel="stylesheet" href="css/ordenes.css">
</head>
<body>

<div class="header">
    <div>
        <div class="company-name">VSS Fábrica S.A.C.</div>
        <h1>⚙️ Costos Indirectos (CIF)</h1>
    </div>
    <div class="datetime" id="currentDateTime"></div>
</div>

<div class="main-content">
    <div id="alertContainer"></div>

    <div class="metrics">
        <div class="metric metric-activo">
            <div class="metric-icon">⚙️</div>
            <div class="metric-label">CIF Total</div>
            <strong id="cifTotal">S/ 0.00</strong>
            <small>Costos indirectos de fabricación</small>
        </div>
        <div class="metric metric-ventas">
            <div class="metric-icon">📊</div>
            <div class="metric-label">Conceptos</div>
            <strong id="cifConceptos">0</strong>
            <small>Tipos de CIF</small>
        </div>
        <div class="metric metric-compras">
            <div class="metric-icon">🎯</div>
            <div class="metric-label">Inductores</div>
            <strong id="cifInductores">0</strong>
            <small>Distintos inductores</small>
        </div>
    </div>

    <div class="card">
        <h2>📊 CIF por Concepto</h2>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Concepto</th>
                        <th>Inductor</th>
                        <th style="text-align:right;">OT-101</th>
                        <th style="text-align:right;">OT-102</th>
                        <th style="text-align:right;">OT-103</th>
                        <th style="text-align:right;">Total</th>
                    </tr>
                </thead>
                <tbody id="cifTable"></tbody>
            </table>
        </div>
    </div>

    <div class="footer-info">
        <p>VSS Fábrica S.A.C. © 2026 | RUC 20601234567</p>
    </div>
</div>

<script>
    window.textCell = window.textCell || function(value) {
        if (value === null || value === undefined) return '';
        return String(value).replace(/&/g, '&amp;').replace(/</g, '&lt;')
            .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    };
</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/db.js"></script>
<script src="js/utils.js"></script>
<script src="js/accounting.js"></script>
<script src="js/fab-menu.js"></script>
<script src="js/cif.js"></script>
<script src="js/professional-ot.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', async function() {
        if (!initSupabase()) { alert('❌ Error'); return; }
        updateDateTime();
        setInterval(updateDateTime, 60000);
        await initCIF();
    });
</script>

</body>
</html>
