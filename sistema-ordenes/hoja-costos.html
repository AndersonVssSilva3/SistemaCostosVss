<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VSS Fábrica · Hoja de Costos</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧾</text></svg>">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/professional.css">
    <link rel="stylesheet" href="css/vss.css">
    <link rel="stylesheet" href="css/vss-3d.css">
    <link rel="stylesheet" href="css/fab-menu.css">
    <link rel="stylesheet" href="css/ordenes.css">
    <style>
        .hc-encabezado { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px 20px; margin-bottom: 20px; }
        .hc-encabezado div { font-size: 13px; color: #56677b; }
        .hc-encabezado strong { display: block; font-size: 15px; color: #102b46; }
        .hc-seccion { margin-top: 22px; }
        .hc-seccion h3 { font-size: 14px; letter-spacing: 1px; text-transform: uppercase; color: #102b46; border-bottom: 2px solid #102b46; padding-bottom: 6px; margin-bottom: 8px; }
        .hc-subtotal td { font-weight: 800; border-top: 2px solid #102b46; background: #f5f7fa; }
        .hc-resumen { max-width: 520px; margin-left: auto; }
        .hc-resumen td:last-child { text-align: right; font-variant-numeric: tabular-nums; }
        .hc-resumen .hc-total td { font-weight: 800; font-size: 15px; border-top: 2px solid #102b46; background: #eaf3fc; }
        @media print {
            .app-sidebar, .fab-container, .fab-overlay, .no-print { display: none !important; }
            body { padding-left: 0 !important; }
        }
    </style>
</head>
<body>

<div class="header">
    <div>
        <div class="company-name">VSS Fábrica S.A.C.</div>
        <h1>🧾 Hoja de Costos</h1>
    </div>
    <div class="datetime" id="currentDateTime"></div>
</div>

<div class="main-content">
    <div id="alertContainer"></div>

    <div class="card no-print">
        <div class="form-row" style="align-items:flex-end;">
            <div class="form-group">
                <label>Orden de Trabajo</label>
                <select id="hcOT" onchange="renderHojaCostos()"></select>
            </div>
            <div class="form-group">
                <button class="btn btn-warning" onclick="window.print()">🖨️ Imprimir / PDF</button>
            </div>
        </div>
    </div>

    <div class="card" id="hojaCostos">
        <p style="text-align:center; color:#999;">Cargando...</p>
    </div>

    <div class="footer-info">
        <p>VSS Fábrica S.A.C. © 2026 | RUC 20601234567</p>
    </div>
</div>

<script>
    window.textCell = window.textCell || function(value) {
        if (value === null || value === undefined) return '';
        return String(value).replace(/&/g, '&amp;').replace(/</g, '&lt;')
            .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    };
</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/db.js"></script>
<script src="js/utils.js"></script>
<script src="js/accounting.js"></script>
<script src="js/fab-menu.js"></script>
<script src="js/hoja-costos.js"></script>
<script src="js/professional-ot.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', async function() {
        if (!initSupabase()) { alert('❌ Error: No se pudo conectar con Supabase'); return; }
        updateDateTime();
        setInterval(updateDateTime, 60000);
        await initHojaCostos();
    });
</script>

<script src="../aurora/aurora.js" defer></script>
</body>
</html>
